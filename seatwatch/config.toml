# seatwatch - The Odyssey, IMAX 70mm, Montreal
#
# The theatre and film IDs below are already filled in. The only thing left
# is one [[showtimes]] block per screening you want watched. Fastest way:
#
#   1. Open the showtime on cineplex.com, click through to the seat picker.
#   2. Copy the address bar.
#   3. python -m seatwatch add-showtime --url "<paste>" --label "Fri 7:00 PM"
#   4. python -m seatwatch dump      # confirm real seats come back
#
# add-showtime pulls the IDs out of the URL and appends the block for you.

[theatre]
# Cinema Banque Scotia Montreal - Quebec's only IMAX 70mm screen.
# theatreId from the theatre page's __NEXT_DATA__ (props.pageProps.theatreDetails).
id = "9406"
location_id = "9406"
name = "Cinema Banque Scotia Montreal"
booking_url = "https://www.cineplex.com/movie/imax70-the-odyssey-the-imax-experience-in-7"
# The Odyssey: The IMAX Experience in 70MM Film. Used by `discover` to filter.
film_id = "37617"  # id in the showtimes feed (parent page id is 38376)

[criteria]
# Row E and back — the good half for 70mm IMAX.
min_row = "E"
# Optional back limit, e.g. "L". Empty means no limit.
max_row = ""
# 0.0 = dead centre, 1.0 = the outermost seat. 0.5 keeps the middle half and
# excludes edge seats entirely. This means silence until a genuinely central
# E+ seat cancels — the right trade for wanting a good seat, not any seat.
max_centre_offset = 0.5
# Wheelchair and companion seats are left for people who need them.
include_accessible = false
# Raise to 2 to only hear about pairs of seats side by side.
min_adjacent = 1

[alerts]
# ntfy priority. "max" (5) punches through Do Not Disturb, so an early
# cancellation actually wakes you. Drop to "high" for a normal loud
# notification that respects DND.
priority = "max"

[poll]
# Each run polls continuously for ~50 minutes, not a brief snapshot. GitHub
# fires the 5-minute cron unreliably (often 20-60 min late), so a short run
# leaves big blind spots; a long one plus the workflow's concurrency guard
# (at most one run pending) means the next run starts as soon as this ends,
# giving near-continuous coverage regardless of cron lateness.
interval_seconds = 45
duration_seconds = 3000
# Do not re-alert about the same seat for 6 hours.
cooldown_seconds = 21600
# Tell me about seats that are already free the very first time this runs.
alert_on_first_run = true
state_path = "state/state.json"
# After this many consecutive failed polls, send a "seatwatch is broken"
# notice. Otherwise a dead endpoint looks exactly like a sold-out show.
health_warn_after = 3
# Cap on seat requests per ~50-minute run. The run spends this on the
# soonest showtimes first: imminent shows (< 12h) polled every pass, nearer
# days less often, later-in-week a single baseline check. 450 over 50 min is
# ~9/min; with runs chained back-to-back that is ~540 requests/hour at the
# ceiling and usually far less. It works out to the imminent shows being
# checked roughly every 75 seconds, continuously. Lower to be gentler.
max_requests_per_run = 450

[api]
base_url = "https://apis.cineplex.com"
# Override only if Cineplex moves these paths. {theatre_id} and {showtime_id}
# are substituted in.
availability_path = ""
layout_path = ""

[discovery]
# Watch every Odyssey showtime at this theatre over the next N days instead
# of listing them by hand. Needs CINEPLEX_API_KEY as a repo secret - the
# showtimes feed is the one Cineplex endpoint that requires a key. With it
# off (or the key missing), only the [[showtimes]] blocks below are watched.
enabled = true
days = 7
# Only IMAX 70mm sessions, not the regular or plain-70mm screenings.
experiences = ["IMAX", "70mm"]

# Discovery hits /prod/cpx/theatrical/api/v1/theatres/{id}/showtimes/{date},
# the route Cineplex's own site uses. It answers 401 without a key.

# One block per screening. These 28 IMAX 70mm sessions were discovered
# for 2026-08-21..27, with ISO start times so the closest showtimes get
# polled most aggressively. With [discovery] on they refresh automatically.

[[showtimes]]
id = "404523"
label = "Fri 21 Aug, 11:00 AM (IMAX/70mm)"
starts = "2026-08-21T11:00:00"
url = "https://www.cineplex.com/ticketing/preview?theatreId=9406&showtimeId=404523"

