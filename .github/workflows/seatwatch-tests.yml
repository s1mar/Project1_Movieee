name: seatwatch tests

on:
  push:
    paths: ['seatwatch/**', '.github/workflows/seatwatch*.yml']
  pull_request:
    paths: ['seatwatch/**', '.github/workflows/seatwatch*.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s seatwatch/tests -t . -v
      - name: Config must stay parseable
        run: python -c "import tomllib; tomllib.load(open('seatwatch/config.toml','rb'))"
